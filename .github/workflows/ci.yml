name: AI-Native Repo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync & Verify AI-Native Architecture
        run: |
          python3 scripts/sync_context.py
          python3 scripts/verify_architecture.py
          git diff --exit-code AGENTS.md
